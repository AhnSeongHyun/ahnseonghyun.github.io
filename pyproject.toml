[project]
name = "ahnseonghyun-github-io"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.1.0",
    "zvc==0.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set so results do not drift with ruff defaults (CI installs latest).
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
